services:
  db:
    image: postgres:16-alpine
    container_name: recsys-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - recsys-db-data:/var/lib/postgresql/data

  fastapi:
    build: ./model_service
    container_name: recsys-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    volumes:
      # Offline artifacts produced by the notebooks (01-05) — mounted
      # read-only since the API only ever reads them, never writes.
      - ./data:/app/data:ro
      - ./checkpoints:/app/checkpoints:ro
    depends_on:
      db:
        condition: service_healthy

  streamlit:
    build: ./webapp
    container_name: recsys-frontend
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - API_URL=http://fastapi:8000
    depends_on:
      - fastapi

volumes:
  recsys-db-data:
